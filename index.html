<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BierzTo Merch | Sklep</title>
    <style>
        /* CSS - Liquid Glass Effect */
        :root {
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .bg-blur {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #1a1a1a 0%, #000 70%);
            z-index: -1;
        }

        /* iOS Style Navigation */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            z-index: 1000;
        }

        nav a { color: white; text-decoration: none; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; transition: 0.3s; }
        nav a:hover { opacity: 1; text-shadow: 0 0 10px #fff; }

        header {
            margin-top: 150px;
            text-align: center;
        }

        .main-logo {
            width: 280px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
            margin-bottom: 20px;
        }

        /* Grid na 5 produktów */
        .shop-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1200px;
            margin: 60px auto;
        }

        .product-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            墜ackdrop-filter: blur(10px);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255,255,255,0.3);
            box-shadow: var(--glow);
        }

        /* Kontener na grafikę produktu */
        .product-img-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: rgba(255,255,255,0.02);
            border-radius: 18px;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Grafika ładnie wypełnia kwadrat */
        }

        h2 { font-size: 1.2rem; margin: 10px 0; font-weight: 500; }
        .price { font-size: 1.1rem; color: #888; margin-bottom: 20px; }

        .buy-btn {
            background: #fff;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background: #e0e0e0;
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        .about {
            max-width: 700px;
            margin: 100px auto;
            text-align: center;
            padding: 40px;
            background: var(--glass);
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <nav>
        <a href="#merch">Merch</a>
        <a href="#about">O nas</a>
        <a href="#">Koszyk</a>
    </nav>

    <header>
        <img src="logo.png" alt="BierzTo Logo" class="main-logo">
    </header>

    <div class="shop-container" id="merch">
        
        <div class="product-card">
            <div class="product-img-container">
                <img src="produkt1.png" alt="Produkt 1">
            </div>
            <h2>Bluza Classic BT</h2>
            <div class="price">199.00 PLN</div>
            <button class="buy-btn">Dodaj do koszyka</button>
        </div>

        <div class="product-card">
            <div class="product-img-container">
                <img src="produkt2.png" alt="Produkt 2">
            </div>
            <h2>Hoodie Liquid Glass</h2>
            <div class="price">249.00 PLN</div>
            <button class="buy-btn">Dodaj do koszyka</button>
        </div>

        <div class="product-card">
            <div class="product-img-container">
                <img src="produkt3.png" alt="Produkt 3">
            </div>
            <h2>T-shirt Oversize</h2>
            <div class="price">129.00 PLN</div>
            <button class="buy-btn">Dodaj do koszyka</button>
        </div>

        <div class="product-card">
            <div class="product-img-container">
                <img src="produkt4.png" alt="Produkt 4">
            </div>
            <h2>Czapka Beanie BT</h2>
            <div class="price">89.00 PLN</div>
            <button class="buy-btn">Dodaj do koszyka</button>
        </div>

        <div class="product-card">
            <div class="product-img-container">
                <img src="produkt5.png" alt="Produkt 5">
            </div>
            <h2>Akcesorium Limited</h2>
            <div class="price">59.00 PLN</div>
            <button class="buy-btn">Dodaj do koszyka</button>
        </div>

    </div>

    <div class="about" id="about">
        <img src="banner.png" alt="Banner" style="width: 150px; margin-bottom: 20px;">
        <h2>O marce</h2>
        <p>BierzTo to nie tylko ubrania, to styl życia. Nasz merch to limitowane dropy dla tych, którzy wiedzą co dobre.</p>
    </div>

</body>
</html>
